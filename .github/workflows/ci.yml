name: ci
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      release:
        description: draft release tag to attach the installer to
        required: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y xdelta3 shellcheck
      - name: lint
        run: bash tests/lint.sh
      - name: installer tests
        run: bash tests/test_install.sh
      - name: rebuild tool tests
        run: python3 -m unittest tests/test_make_patch.py
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: engine tests
        run: go vet ./... && go test ./...
      - name: release checksums
        run: sha256sum -c SHA256SUMS
      - name: manifest matches delta
        run: |
          set -euo pipefail
          d=patches/megaton-1.4.9-linux
          want=$(grep '^DELTA_SHA256=' "$d/manifest" | cut -d= -f2)
          test "$(sha256sum "$d/duke3d.xdelta" | cut -d' ' -f1)" = "$want"
          test "$(wc -l < "$d/changes.tsv")" = 353
          xdelta3 printhdr "$d/duke3d.xdelta" > /dev/null
          test "$(wc -l < patches/megaton-1.4.9-windows/changes.tsv)" = 399
  installer:
    runs-on: ubuntu-22.04
    needs: test
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: engine
        run: |
          set -euo pipefail
          pkg=installer/packages/io.github.larsoyd.duke3dultrawide
          mkdir -p "$pkg/data"
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -buildid=' -o "$pkg/data/duke3d-ultrawide" ./cmd/duke3d-ultrawide
          cp README.md LICENSE "$pkg/data/"
      - name: installer framework
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-randr0 libxcb-shape0 libgl1 libfontconfig1 libdbus-1-3
          python3 -m pip install --quiet aqtinstall
          tool=$(python3 -m aqt list-tool linux desktop tools_ifw | grep -o 'qt.tools.ifw.[0-9]*' | sort -V | tail -1)
          python3 -m aqt install-tool linux desktop tools_ifw "$tool" --outputdir "$RUNNER_TEMP/qt"
          echo "IFW_BIN=$(dirname "$(find "$RUNNER_TEMP/qt" -name binarycreator -type f | head -1)")" >> "$GITHUB_ENV"
      - name: build
        run: |
          set -euo pipefail
          ls "$IFW_BIN"
          v=$(sed -n 's#.*<Version>\(.*\)</Version>.*#\1#p' installer/config/config.xml)
          echo "OUT=DukeNukem3D-Megaton-UltrawideFix-$v.run" >> "$GITHUB_ENV"
          "$IFW_BIN/binarycreator" --offline-only -c installer/config/config.xml -p installer/packages "DukeNukem3D-Megaton-UltrawideFix-$v.run"
          sha256sum "DukeNukem3D-Megaton-UltrawideFix-$v.run"
      - name: attach to draft release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --json isDraft -q .isDraft)" = true
          gh release upload "$TAG" "$OUT" --clobber
  windows-installer:
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: engine tests
        run: go vet ./... && go test ./...
      - name: engine
        run: |
          set -euo pipefail
          pkg=installer/packages/io.github.larsoyd.duke3dultrawide
          mkdir -p "$pkg/data"
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -buildid=' -o "$pkg/data/duke3d-ultrawide.exe" ./cmd/duke3d-ultrawide
          cp README.md LICENSE "$pkg/data/"
      - name: screen query
        shell: pwsh
        run: Get-CimInstance Win32_VideoController | Where-Object CurrentHorizontalResolution | Select-Object -First 1 | ForEach-Object { '' + $_.CurrentHorizontalResolution + 'x' + $_.CurrentVerticalResolution }
      - name: installer framework
        run: |
          set -euo pipefail
          python -m pip install --quiet aqtinstall
          tool=$(python -m aqt list-tool windows desktop tools_ifw | grep -o 'qt.tools.ifw.[0-9]*' | sort -V | tail -1)
          python -m aqt install-tool windows desktop tools_ifw "$tool" --outputdir "$RUNNER_TEMP/qt"
          echo "IFW_BIN=$(dirname "$(find "$RUNNER_TEMP/qt" -name binarycreator.exe -type f | head -1)")" >> "$GITHUB_ENV"
      - name: build
        run: |
          set -euo pipefail
          v=$(sed -n 's#.*<Version>\(.*\)</Version>.*#\1#p' installer/config/config.xml)
          echo "OUT=DukeNukem3D-Megaton-UltrawideFix-$v.exe" >> "$GITHUB_ENV"
          "$IFW_BIN/binarycreator.exe" --offline-only -c installer/config/config.xml -p installer/packages "DukeNukem3D-Megaton-UltrawideFix-$v.exe"
          sha256sum "DukeNukem3D-Megaton-UltrawideFix-$v.exe"
      - name: attach to draft release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --json isDraft -q .isDraft)" = true
          gh release upload "$TAG" "$OUT" --clobber
